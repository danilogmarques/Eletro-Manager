services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lumina_gestao
      POSTGRES_USER: lumina
      POSTGRES_PASSWORD: lumina_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumina -d lumina_gestao"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sh -c "npm run db:generate && npm run db:deploy && npm run dev"
    environment:
      PORT: 3000
      FRONTEND_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://lumina:lumina_dev@db:5432/lumina_gestao?schema=public
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_URL: http://localhost:3000/api
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
